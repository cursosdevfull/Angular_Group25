services:
  mysql:
    image: mysql:8
    container_name: mysql-course
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_USER: user-course
      MYSQL_PASSWORD: "12345"
      MYSQL_DATABASE: course_db
    volumes:
      - ./data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p12345 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-course
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: user-course
      PMA_PASSWORD: 12345
    ports:
      - "8080:80"
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
