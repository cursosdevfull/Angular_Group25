<cdev-lib-table [data]="data()" [metaColumns]="metaColumns" (onSelectedRow)="selectedRow($event)">
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef style="width:60px"></th>
        <td mat-cell *matCellDef="let element">
            <button matIconButton (click)="deleteRow($event, element)">
                <mat-icon>delete_outline</mat-icon>
            </button>
        </td>
    </ng-container>
</cdev-lib-table>
<cdev-lib-paginator [length]="totalItems" (onPageChanged)="loadDataByPage($event)"></cdev-lib-paginator>
