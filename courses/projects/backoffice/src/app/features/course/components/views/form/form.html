<mat-dialog-content>
    <mat-toolbar>
        <h2>{{ courseForm.id ? 'Edit' : 'Create' }}</h2>
        <button matIconButton mat-dialog-close>
            <mat-icon>close</mat-icon>
        </button>
    </mat-toolbar>
    <form>
        <div class="fields">
            <mat-form-field>
                <mat-label>Name</mat-label>
                <input matInput type="text" id="name" [formField]="courseForm.name" />
            </mat-form-field>
            <mat-form-field>
                <mat-label>Level</mat-label>
                <mat-select [formField]="courseForm.level">
                    @for(level of ['Beginner', 'Intermediate', 'Advanced']; track level){
                    <mat-option [value]="level">
                        {{ level }}
                    </mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>
        <div class="actions">
            <button matButton="filled" type="button" (click)="save()">{{ courseForm.id ? 'Update' : 'Create' }}</button>
            <button matButton type="button" mat-dialog-close>Cancel</button>
        </div>
    </form>
</mat-dialog-content>
