<mat-dialog-content>
    <form>
        <mat-form-field>
            <mat-label>Course Name</mat-label>
            <input matInput type="text" id="name" [formField]="form.name" />
        </mat-form-field>
        <mat-form-field>
            <mat-label>Course Level</mat-label>
            <input matInput type="text" id="level" [formField]="form.level" />
        </mat-form-field>
    </form>
</mat-dialog-content>
