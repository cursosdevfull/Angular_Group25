<ng-content></ng-content>

<cdev-lib-scrollbars [customStyle]="'height:90%;'">
    <table mat-table class="mat-elevation-z8" [dataSource]="data()">
        @for(column of metaColumns(); track column){
        <ng-container matColumnDef="{{ column.field }}">
            <th mat-header-cell *matHeaderCellDef> {{ column.label }} </th>
            <td mat-cell *matCellDef="let element"> {{ element[column.field] }} </td>
        </ng-container>
        }
        <ng-container>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns(); sticky: true" class="header"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns();" class="row" (click)="selectRow(row)"></tr>
    </table>
</cdev-lib-scrollbars>
