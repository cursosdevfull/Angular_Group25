<mat-toolbar>
    <h2>Confirm</h2>
</mat-toolbar>
<mat-dialog-content>
    <h3 mat-dialog-title>{{ message }}</h3>
    <mat-dialog-actions>
        <button matButton="filled" [mat-dialog-close]="true">Confirm</button>
        <button mat-button mat-dialog-close>Cancel</button>
    </mat-dialog-actions>
</mat-dialog-content>
